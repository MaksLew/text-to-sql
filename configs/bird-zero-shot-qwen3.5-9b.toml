model = "qwen/qwen3.5-9b"
num_rollouts = 1
max_concurrent = 8
push = true

[sampling]
temperature = 0.0
max_tokens = 4096

[client]
type = "eval"
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"

[env.timeout]
episode = 300

[env.taskset]
id = "bird-zero-shot"
split = "dev"
data_dir = "data/bird/dev_20251106"

[env.agent]
max_turns = 12

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
