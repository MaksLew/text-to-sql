model = "qwen3.5-4b"
num_rollouts = 1
max_concurrent = 1
push = false

[sampling]
temperature = 0.0
max_tokens = 768

[client]
type = "eval"
base_url = "http://localhost:8080/v1"
api_key_var = "LLAMA_CPP_API_KEY"

[env.timeout]
episode = 300

[env.taskset]
id = "bird-v1"
split = "dev"
data_dir = "data/bird/dev_20251106"

[env.agent]
max_turns = 6

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
