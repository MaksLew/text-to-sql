[project]
name = "bird-v1"
version = "0.1.0"
description = "Agentic BIRD dev text-to-SQL taskset."
requires-python = ">=3.11"
dependencies = ["sqlglot>=30,<31", "verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bird_v1"]
